<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Content Planning Suite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-purple-50 via-white to-blue-50 p-6 flex items-center justify-center">

  <div class="max-w-6xl mx-auto w-full">
    <!-- Header -->
    <div class="text-center mb-8 relative">

      <h1 class="text-4xl font-bold text-gray-900 mb-2">
        Instant Content Planner
      </h1>
      <p class="text-gray-600">
        A all-in-one toolkit for content ideation and planning
      </p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-xl shadow-[0_0_50px_rgba(0,0,0,0.1)] overflow-hidden min-h-[500px]">

      <!-- Tabs -->
      <div id="tabs" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 border-b"></div>

      <!-- Content -->
      <div class="p-6">
        <!-- API Key Config -->
        <div class="mb-4">
          <div class="flex gap-3 items-center">
            <input id="apiKeyInput" type="password" placeholder="Enter API key (stored locally)"
              class="flex-1 px-4 py-2 border border-gray-300 rounded-lg bg-gray-50 text-sm" />
            <button id="saveApiKeyBtn" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm">Save</button>
            <button id="clearApiKeyBtn" class="px-4 py-2 bg-red-100 text-red-700 rounded-lg text-sm">Clear</button>
          </div>
          <p id="apiKeyHint" class="mt-2 text-xs text-gray-500">Stored locally in your browser.</p>
        </div>
        <!-- Input -->
        <div class="mb-6">
          <div class="flex gap-3">
            <label for="userInput" class="sr-only">Input for content tool</label>
            <input id="userInput" type="text" placeholder="Enter your niche or industry (e.g., digital marketing)"
              title="Enter your niche or industry (e.g., digital marketing)"
              class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" />
            <button id="generateBtn"
              class="px-6 py-3 bg-purple-600 text-white rounded-lg font-medium hover:bg-purple-700 disabled:bg-gray-300">
              Generate
            </button>
          </div>
        </div>

        <!-- Loader -->
        <div id="loader" class="hidden flex justify-center py-12">
          <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-600"></div>
        </div>

        <!-- Results -->
        <div id="results" class="space-y-3"></div>

        <!-- Empty State -->
        <div id="emptyState" class="text-center py-12 text-gray-400">
          <i data-lucide="lightbulb" class="mx-auto mb-3 opacity-50"></i>
          <p>Enter your input above and click Generate to get started</p>
        </div>
      </div>
    </div>

    <div class="mt-6 text-center text-sm text-gray-500">
      💡 Tip: Be specific with your input for better results
    </div>
  </div>



  <script>
    /* -------------------- STATE -------------------- */
    let activeTab = "topic";
    let loading = false;
    let copiedIndex = null;
    let apiKey = localStorage.getItem("gemini_api_key") || "";

    const tools = [
      { id: "topic", name: "Blog Topics", icon: "lightbulb", placeholder: "Enter your niche or industry (e.g., digital marketing)" },
      { id: "idea", name: "Content Ideas", icon: "sparkles", placeholder: "Describe your audience or theme" },
      { id: "headline", name: "Headlines", icon: "hash", placeholder: "Enter your article topic" },
      { id: "viral", name: "Viral Titles", icon: "trending-up", placeholder: "Topic you want to go viral with" },
      { id: "angle", name: "Content Angles", icon: "target", placeholder: "Enter your topic" },
      { id: "outline", name: "Blog Outline", icon: "file-text", placeholder: "Enter your blog title" }
    ];

    /* -------------------- ELEMENTS -------------------- */
    const tabsEl = document.getElementById("tabs");
    const inputEl = document.getElementById("userInput");
    const btnEl = document.getElementById("generateBtn");
    const loaderEl = document.getElementById("loader");
    const resultsEl = document.getElementById("results");
    const emptyEl = document.getElementById("emptyState");


    /* -------------------- RENDER TABS -------------------- */
    function renderTabs() {
      tabsEl.innerHTML = "";
      tools.forEach(tool => {
        const btn = document.createElement("button");
        btn.className = `
      p-4 flex flex-col items-center gap-2 transition-all
      ${activeTab === tool.id
            ? "bg-purple-600 text-white"
            : "bg-white text-gray-600 hover:bg-gray-50"}
    `;
        btn.innerHTML = `
      <i data-lucide="${tool.icon}" width="20"></i>
      <span class="text-xs font-medium text-center">${tool.name}</span>
    `;
        btn.onclick = () => {
          activeTab = tool.id;
          resultsEl.innerHTML = "";
          inputEl.value = "";
          updatePlaceholder();
          renderTabs();
          toggleEmpty(true);
        };
        tabsEl.appendChild(btn);
      });
      lucide.createIcons();
    }

    /* -------------------- PLACEHOLDER -------------------- */
    function updatePlaceholder() {
      const tool = tools.find(t => t.id === activeTab);
      inputEl.placeholder = tool.placeholder;
    }

    /* -------------------- UI HELPERS -------------------- */
    function toggleLoading(show) {
      loading = show;
      loaderEl.classList.toggle("hidden", !show);
      btnEl.disabled = show;
    }

    function toggleEmpty(show) {
      emptyEl.classList.toggle("hidden", !show);
    }



    /* -------------------- COPY -------------------- */
    function copyText(text, index) {
      navigator.clipboard.writeText(text);
      copiedIndex = index;
      renderResults(currentResults);
      setTimeout(() => {
        copiedIndex = null;
        renderResults(currentResults);
      }, 2000);
    }

    /* -------------------- API KEY UI -------------------- */
    function initApiKeyUI() {
      const keyInput = document.getElementById('apiKeyInput');
      const saveBtn = document.getElementById('saveApiKeyBtn');
      const clearBtn = document.getElementById('clearApiKeyBtn');
      const hint = document.getElementById('apiKeyHint');

      keyInput.value = localStorage.getItem('gemini_api_key') || '';

      saveBtn.onclick = () => {
        const v = keyInput.value.trim();
        if (!v) {
          alert('Please enter a non-empty API key to save.');
          return;
        }
        localStorage.setItem('gemini_api_key', v);
        apiKey = v;
        hint.textContent = 'Saved locally. Ready to use.';
      };

      clearBtn.onclick = () => {
        localStorage.removeItem('gemini_api_key');
        keyInput.value = '';
        apiKey = '';
        hint.textContent = 'Cleared. Please enter a new API key to continue.';
      };
    }

    /* -------------------- API INTEGRATION -------------------- */
    let currentResults = [];

    function getPrompt(type, input) {
      const safetyInstruction = " Strictly avoid any adult, NSFW, 18+, or explicit content. Keep the content family-friendly and safe for work.";
      const prompts = {
        topic: `Generate 10 creative and trending blog topic ideas for the niche: "${input}".${safetyInstruction} Return ONLY a JSON array of strings. Example: ["Topic 1", "Topic 2"]`,
        idea: `Generate 10 unique content ideas for the theme/audience: "${input}".${safetyInstruction} Return ONLY a JSON array of strings.`,
        headline: `Generate 10 catchy, high-CTR headlines for the topic: "${input}".${safetyInstruction} Return ONLY a JSON array of strings.`,
        viral: `Generate 10 viral-worthy titles for the topic: "${input}". Focus on curiosity and emotion.${safetyInstruction} Return ONLY a JSON array of strings.`,
        angle: `Generate 10 unique content angles or perspectives for the topic: "${input}".${safetyInstruction} Return ONLY a JSON array of strings.`,
        outline: `Generate a blog post outline for the title: "${input}".${safetyInstruction} Return the outline as a flat list of section headers in a JSON array of strings.`
      };
      return prompts[type] || prompts.topic;
    }

    async function generateContent() {
      const input = inputEl.value.trim();
      if (!input) return;

      const bannedKeywords = ["nsfw", "adult", "xxx", "porn", "sex", "18+", "nude", "explicit"];
      if (bannedKeywords.some(kw => input.toLowerCase().includes(kw))) {
        alert("Adult or explicit content is not allowed in this application.");
        return;
      }

      // ensure we use the latest stored key
      apiKey = localStorage.getItem('gemini_api_key') || '';
      if (!apiKey) {
        alert("API Config Error: No API key found. Please enter and save your API key above.");
        document.getElementById('apiKeyInput').focus();
        return;
      }

      toggleLoading(true);
      toggleEmpty(false);
      resultsEl.innerHTML = "";

      // Updated list based on user's available models
      const modelsToTry = [
        "gemini-2.5-flash",
        "gemini-2.0-flash",
        "gemini-2.0-flash-exp",
        "gemini-1.5-flash",
        "gemini-pro"
      ];

      let success = false;
      let errorLog = [];

      for (const model of modelsToTry) {
        try {
          console.log(`Attempting with model: ${model}`);
          const prompt = getPrompt(activeTab, input);

          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }]
            })
          });

          const data = await response.json();

          if (data.error) {
            throw new Error(`${data.error.code || 'Error'} - ${data.error.message}`);
          }

          const text = data.candidates[0].content.parts[0].text;
          const cleanText = text.replace(/```json|```/g, "").trim();

          try {
            currentResults = JSON.parse(cleanText);
            if (!Array.isArray(currentResults)) throw new Error("Invalid format");
          } catch (e) {
            currentResults = cleanText.split("\n").filter(line => line.trim().length > 0);
          }

          renderResults(currentResults);
          success = true;
          break;

        } catch (error) {
          console.warn(`Model ${model} failed:`, error);
          const msg = (error && error.message) ? error.message : String(error);
          const lower = msg.toLowerCase();

          if (lower.includes('leaked') || lower.includes('reported as leaked') || lower.includes('reported as leaked')) {
            errorLog.push(`<b>${model}</b>: API key was reported as leaked — please clear and use a new API key (use the field above).`);
          } else if (lower.includes('quota') || lower.includes('429') || lower.includes('exceeded')) {
            errorLog.push(`<b>${model}</b>: Quota exceeded or rate-limited. ${msg}`);
          } else if (lower.includes('not found') || lower.includes('404')) {
            errorLog.push(`<b>${model}</b>: Model not found or unsupported for this API version.`);
          } else {
            errorLog.push(`<b>${model}</b>: ${msg}`);
          }
        }
      }

      if (!success) {
        // Run diagnostics to list models again, just in case
        let availableModelsStr = "Could not fetch models";
        try {
          const listResp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
          const listData = await listResp.json();
          if (listData.models) {
            availableModelsStr = listData.models.map(m => m.name.replace('models/', '')).join(', ');
          }
        } catch (e) {
          availableModelsStr = "Network error checking models";
        }

        resultsEl.innerHTML = `
          <div class="p-4 bg-red-50 text-red-600 rounded-lg">
            <p class="font-bold text-lg mb-2">Generation Failed</p>
            <p class="text-sm mb-4">We tried several models but they all returned errors. Here are the details:</p>
            
            <div class="bg-white p-3 rounded border border-red-200 text-xs font-mono mb-4 overflow-x-auto">
              ${errorLog.join('<br/>')}
            </div>

            <p class="text-sm font-bold">Your Available Models:</p>
            <p class="text-xs font-mono bg-gray-100 p-2 rounded mt-1 break-all text-gray-600">${availableModelsStr}</p>
          </div>
        `;
      }

      toggleLoading(false);
    }

    /* -------------------- RENDER RESULTS -------------------- */
    function renderResults(results) {
      resultsEl.innerHTML = "";
      results.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "group p-4 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors relative";
        div.innerHTML = `
      <div class="flex items-start justify-between gap-3">
        <p class="text-gray-800 flex-1">${item}</p>
        <button onclick="copyText('${item.replace(/'/g, "\\'")}', ${index})"
          class="p-2 text-gray-400 hover:text-purple-600">
          ${copiedIndex === index
            ? '<i data-lucide="check" class="text-green-600"></i>'
            : '<i data-lucide="copy"></i>'
          }
        </button>
      </div>
    `;
        resultsEl.appendChild(div);
      });
      lucide.createIcons();
    }

    /* -------------------- EVENTS -------------------- */
    btnEl.onclick = generateContent;
    inputEl.addEventListener("keypress", e => {
      if (e.key === "Enter") generateContent();
    });

    /* -------------------- INIT -------------------- */
    renderTabs();
    updatePlaceholder();
    initApiKeyUI();
  </script>

</body>

</html>
